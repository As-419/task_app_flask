{# Barre de navigation. Les liens changent selon l'état de connexion. #}
<nav class="navbar">
  <a class="navbar-brand" href="{{ url_for('main.home') }}">
    <span class="logo">★</span> Daara
  </a>
  <div class="navbar-links">
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('main.dashboard') }}">Tableau de bord</a>
      <a href="{{ url_for('maitres.liste') }}">Maîtres</a>
      <a href="{{ url_for('classes.liste') }}">Classes</a>
      <a href="{{ url_for('talibes.liste') }}">Talibés</a>
      <a href="{{ url_for('progressions.liste') }}">Progressions</a>
      <a href="{{ url_for('users.profile') }}">Profil</a>
      <a href="{{ url_for('auth.logout') }}">Déconnexion</a>
      <span class="navbar-user">Bonjour, {{ current_user.username }}</span>
    {% else %}
      <a href="{{ url_for('main.home') }}">Accueil</a>
      <a href="{{ url_for('auth.login') }}">Connexion</a>
      <a class="btn btn-sm" href="{{ url_for('auth.register') }}">Inscription</a>
    {% endif %}
  </div>
</nav>

{% extends "base.html" %}

{% block title %}Accueil — Task App{% endblock %}

{% block content %}
  <section class="hero">
    <h1>Bienvenue sur Task App</h1>
    <p class="lead">
      Organisez vos tâches simplement : créez un compte, connectez-vous,

  </section>
{% endblock %}
